---
# inventory/group_vars/all/fs.yml
# FS01-WIN file server settings: computer name, features, SMB shares and NTFS
# permissions. It lives in group_vars/all, like ad.yml, so Ansible loads it
# automatically and nothing needs to include it. Only the fs01-win role
# (roles/fs01-win/tasks/) reads these values. Names start with fileserver_.

# Computer name. Windows limits this to 15 characters.
fileserver_hostname: "fs01-win"

# Windows features the file server needs.
fileserver_features:
  - FS-FileServer      # SMB file sharing

# Folder on fs01 that holds every share.
fileserver_share_root: 'C:\Shares'

# SMB shares from the planning document: Public, Departments and Home.
#   full / change / read  share permissions: who may use the share over the network
#   ntfs_allow            extra NTFS permissions on this share's folder, added on
#                         top of what it inherits from the share root (may be empty)
# "Authenticated Users" means anyone who logged in with a valid account. Unlike
# "Everyone", it excludes the Guest account.
# Departments and Home stay admin-only until fs01 joins yabe.corp and AD groups exist.
fileserver_shares:
  - name: Public
    description: "Yabe company-wide files"
    full: Administrators
    read: Authenticated Users
    ntfs_allow:
      - user: Authenticated Users
        rights: ReadAndExecute
  - name: Departments
    description: "Yabe department files"
    full: Administrators
    ntfs_allow: []
  - name: Home
    description: "Yabe user home folders"
    full: Administrators
    ntfs_allow: []

# Base NTFS permissions on the share root (C:\Shares). The role stops this folder
# inheriting from C:\ (which lets every user read and create files), so these
# are the ONLY entries. Every share folder inherits them, plus its own
# ntfs_allow entries above. SYSTEM is Windows itself; Administrators is the
# group Ansible logs in as.
fileserver_root_ntfs_allow:
  - user: SYSTEM
    rights: FullControl
  - user: Administrators
    rights: FullControl
