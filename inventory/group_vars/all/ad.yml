---
# inventory/group_vars/all/ad.yml
# Active Directory data for yabe.corp: OUs, departments, groups, users, GPOs.
# It is in group_vars/all because it describes the
# domain, not one machine. dc01 creates these objects (roles/dc01/tasks/
# users.yml and gpo.yml) and AD replicates them to dc02 on its own; other
# roles can read the same names later, e.g. fs01-win share permissions or
# app01 site access.
# Ansible loads every file in this folder automatically, so nothing needs
# to include it. Names start with ad_, like ad_user_password in the secrets.

# OUs (Organizational Units) are folders inside AD. Our own top-level OUs
# keep company objects apart from the built-in "Users" container, and give
# the GPO something to link to (GPOs can't link to built-in containers).
ad_users_ou: "Yabe Users"
ad_groups_ou: "Yabe Groups"

# Yabe is a mock online marketplace, so the departments are the teams that
# run one. Each gets a child OU under "Yabe Users" and the security group
# named in `group`, stored in "Yabe Groups". The group name is written out
# (not built from the department name) so other roles can look it up here,
# e.g. to give "Engineering Staff" access to a share on fs01-win.
ad_departments:
  - name: Engineering
    group: Engineering Staff
    description: Builds and runs the website, listings and search
  - name: Customer Support
    group: Customer Support Staff
    description: Buyer help desk, returns and disputes
  - name: Trust and Safety
    group: Trust and Safety Staff
    description: Fraud, counterfeit listings and account takedowns
  - name: Seller Services
    group: Seller Services Staff
    description: Onboarding and supporting sellers
  - name: Payments
    group: Payments Staff
    description: Checkout, seller payouts and refunds
  - name: Marketing
    group: Marketing Staff
    description: Promotions, email campaigns and ads

# 30 employees, 5 per department. These are random dummy accounts, we can
