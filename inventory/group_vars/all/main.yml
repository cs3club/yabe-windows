---
# inventory/group_vars/all/main.yml
# Non-secret variables for this project.
# All tunable values live here — never hardcoded in tasks.

domain: "yabe.corp"

# The same domain written as an LDAP "distinguished name" (DC=yabe,DC=corp).
# Active Directory uses this form for paths, e.g. "OU=Yabe Users,DC=yabe,DC=corp".
# Built from `domain` so the name is only typed once. It lives here (not in a
# role) because dc01, dc02 and all member servers will all need it.
domain_dn: "DC={{ domain.split('.') | join(',DC=') }}"

# connection settings
# Using WinRM over SSH so we don't have to bootstrap SSH Servers
ansible_connection: winrm
ansible_port: 5985
ansible_winrm_transport: ntlm

# Reboots. Several steps need one (promoting a DC, joining the domain).
# By default Ansible never reboots: it stops that host and asks you to reboot
# by hand, because a surprise reboot of a DC or scored service is risky.
# Opt in for one run with:  ansible-playbook site.yml -e allow_reboot=true
# (add --limit <host> to allow it for one machine only). It is set here
# for every host, so no role should define its own copy in vars/main.yml.
allow_reboot: false

# -- FS01-WIN file server (fileserver role) ---------------------------------
# Computer name. Windows limits this to 15 characters.
fileserver_hostname: "fs01-win"

# Windows features the file server needs.
fileserver_features:
  - FS-FileServer      # SMB file sharing

# Folder on fs01 that holds every share.
fileserver_share_root: 'C:\Shares'

# SMB shares from the planning document: Public, Departments and Home.
#   full / change / read  share permissions: who may use the share over the network
#   ntfs_allow            extra NTFS permissions on this share's folder, added on
#                         top of what it inherits from the share root (may be empty)
# "Authenticated Users" means anyone who logged in with a valid account. Unlike
# "Everyone", it excludes the Guest account.
# Departments and Home stay admin-only until fs01 joins yabe.corp and AD groups exist.
fileserver_shares:
  - name: Public
    description: "Yabe company-wide files"
    full: Administrators
    read: Authenticated Users
    ntfs_allow:
      - user: Authenticated Users
        rights: ReadAndExecute
  - name: Departments
    description: "Yabe department files"
    full: Administrators
    ntfs_allow: []
  - name: Home
    description: "Yabe user home folders"
    full: Administrators
    ntfs_allow: []

# Base NTFS permissions on the share root (C:\Shares). The role stops this folder
# inheriting from C:\ (which lets every user read and create files), so these
# are the ONLY entries. Every share folder inherits them, plus its own
# ntfs_allow entries above. SYSTEM is Windows itself; Administrators is the
# group Ansible logs in as.
fileserver_root_ntfs_allow:
  - user: SYSTEM
    rights: FullControl
  - user: Administrators
    rights: FullControl
