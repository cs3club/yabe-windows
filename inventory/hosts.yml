---
# inventory/hosts.yml
# Target machines for the Yabe Windows segment (10.30.20.0/24).
# Connection: WinRM over HTTPS (port 5986) with certificate validation (team decision).
# Each host needs an HTTPS listener and its certificate saved under certs/.
# Passwords live in vars/secrets.sops.yml, never in this file.
# See: https://docs.ansible.com/ansible/latest/os_guide/windows_winrm.html

all:
  children:
    windows:
      vars:
        ansible_connection: winrm
        ansible_port: 5986
        ansible_winrm_scheme: https
        ansible_winrm_transport: ntlm
        ansible_winrm_server_cert_validation: validate
        ansible_user: Administrator
      hosts:
        dc01:
          ansible_host: 10.32.212.100  # temporary value
        fs01-win:
          ansible_host: 10.30.20.12
          ansible_winrm_ca_trust_path: "{{ inventory_dir }}/../certs/fs01-win-winrm.crt"
