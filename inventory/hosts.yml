---
# inventory/hosts.yml
# Define your hosts and groups here.
# See: https://docs.ansible.com/ansible/latest/inventory_guide/intro_inventory.html
#
# Every host is automatically in the built-in "all" group, so there is no
# catch-all "windows" group. Groups only exist where plays need to tell
# machines apart.
#
# Variables for every host (connection settings, secrets) live next to this
# file in group_vars/all/. A group_vars/<group>/ or host_vars/<host>/ folder
# here would apply only to that group or host.
 
all:
  children:
    domain_controllers:
      hosts:
        dc01:
          ansible_host: 192.168.10.188   # Windows Server 2016 - primary DC, DNS, temp value
        dc02:
          ansible_host: 10.30.20.11   # Windows Server 2025 - secondary DC, DHCP
    member_servers:
      hosts:
        fs01-win:
          ansible_host: 10.30.20.12   # Windows Server 2019 - SMB, DFS Namespace
        app01:
          ansible_host: 10.30.20.13   # Windows Server 2022 - IIS
