---
# roles/common/tasks/firewall.yml
# Tag: firewall
# Runs LAST (see tasks/main.yml). The order of tasks inside this file is the
# lockout protection:
#   1. allow WinRM            (so step 3 can never cut Ansible off)
#   2. allow each host's scored services
#   3. switch the firewall on with inbound = block
# Test with: --tags firewall --limit <one host> --check --diff
# If WinRM is ever lost, fix it from the VM console:
#   Set-NetFirewallProfile -All -Enabled False
 
# remoteip is set to any on purpose (here and below): it also undoes a
# red-team edit that narrows one of our rules to lock us out.
- name: Allow WinRM from anywhere (keeps Ansible connected)
  ansible.windows.win_firewall_rule:
    name: Hardening - WinRM HTTP
    description: Managed by Ansible (common role). Ansible connects through this rule.
    direction: in
    action: allow
    protocol: tcp
    localport: "5985"
    remoteip: any #Will need updated once we transition to the CS3 server
    profiles: [domain, private, public]
    enabled: true
    state: present
 
# A host gets a rule when it is named in applies_to, or one of its groups is
# ("all" matches everyone). group_names is a magic variable: the list of
# inventory groups the current host belongs to.
- name: Allow inbound ports for this host's services
  ansible.windows.win_firewall_rule:
    name: "Hardening - {{ item.name }}"
    description: Managed by Ansible (common role).
    direction: in
    action: allow
    protocol: "{{ item.protocol }}"
    localport: "{{ item.port }}"
    remoteip: any #Will need updated once we transition to the CS3 server. Only AD-specific roles will be locked to localsubnet
    profiles: [domain, private, public]
    enabled: true
    state: present
  loop: "{{ common_firewall_rules }}"
  loop_control:
    label: "{{ item.name }} {{ item.protocol }}/{{ item.port }}"
  when: item.applies_to | intersect(group_names + [inventory_hostname, 'all']) | length > 0
 
# Blocks inbound traffic that no rule allows. Rules that Windows added when
# roles were installed (AD DS, DNS, DHCP, File Server, IIS) stay in place.
# Allow rules the red team adds are NOT removed here; review them with
# ansible.windows.win_firewall_rule_info or Get-NetFirewallRule.
- name: Turn on the firewall for all profiles and block unsolicited inbound
  ansible.windows.win_firewall:
    profiles: [Domain, Private, Public]
    state: enabled
    inbound_action: block
    outbound_action: allow
