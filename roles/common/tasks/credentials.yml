---
# roles/common/tasks/credentials.yml
# Tag: credentials
# Makes it harder to pull passwords and hashes out of memory (Mimikatz and
# friends) and keeps UAC working the way we expect.
 
- name: Disable WDigest so plaintext passwords are not kept in memory
  ansible.windows.win_regedit:
    path: HKLM:\SYSTEM\CurrentControlSet\Control\SecurityProviders\WDigest
    name: UseLogonCredential
    data: 0
    type: dword
 
# RunAsPPL makes LSASS a "protected process", so even an admin cannot read
# its memory. Takes effect after a reboot. On machines with UEFI Secure Boot,
# value 1 also stores the setting in firmware, so turning it OFF later needs
# Microsoft's LSA opt-out tool; decide before enabling on bare metal.
- name: Set LSA protection (RunAsPPL)
  ansible.windows.win_regedit:
    path: HKLM:\SYSTEM\CurrentControlSet\Control\Lsa
    name: RunAsPPL
    data: "{{ 1 if common_lsa_protection | bool else 0 }}"
    type: dword
  notify: Reboot Windows host
 
# EnableLUA = UAC on. FilterAdministratorToken = 0 is the important one for
# us: if it were 1, the built-in Administrator would get a filtered
# (non-admin) token over WinRM and every Ansible task would fail with
# "access denied". We set it explicitly so nobody turns it on by accident.
# LocalAccountTokenFilterPolicy is deliberately NOT managed here: the
# ConfigureRemotingForAnsible script sets it to 1 and some setups rely on it.
- name: Keep UAC on without breaking Ansible's Administrator login
  ansible.windows.win_regedit:
    path: HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System
    name: "{{ item.name }}"
    data: "{{ item.data }}"
    type: dword
  loop:
    - { name: EnableLUA, data: 1 }
    - { name: FilterAdministratorToken, data: 0 }
  loop_control:
    label: "{{ item.name }}={{ item.data }}"
