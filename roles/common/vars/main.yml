---
# roles/common/vars/main.yml
# Settings for the common role.
# Role vars have HIGH precedence: they beat inventory, group_vars and
# host_vars, and only -e (extra vars) or set_fact can override them.
# To change a value, edit it here (or pass it with -e for a one-off run).
# Every name starts with "common_" so it can't collide with other roles.
# Fixed security settings (registry values that are always the same) live in
# the task files, not here. This file only holds things you might change.
 
# ── General ───────────────────────────────────────────────────────
# Some settings (LSA protection) only take effect after a reboot.
# false = never reboot automatically, just warn. Rebooting mid-competition
# takes scored services down, so a human should choose when.
common_allow_reboot: false
 
# ── credentials ───────────────────────────────────────────────────
# Run LSASS as a protected process (blocks Mimikatz-style memory reads).
# Can break third-party software that injects into LSASS. Needs a reboot.
common_lsa_protection: true
 
# ── accounts ──────────────────────────────────────────────────────
# Local password/lockout policy. Applied to every host that is not (yet) a
# promoted DC; once promoted, the domain's Default Domain Policy takes over
# (future GPO role). NOTE: before promotion this also applies to the DSRM
# safe_mode_password, which must then be >= this length and complex.
common_password_min_length: 14
common_lockout_threshold: 10        # bad attempts before lockout (0 = never)
common_lockout_duration_minutes: 15
common_lockout_reset_minutes: 15    # must be <= duration
 
# ── services ──────────────────────────────────────────────────────
# Services to stop and disable on every host. None of our four machines
# is a print server, so the Print Spooler (PrintNightmare) can go everywhere.
common_disabled_services:
  - Spooler
 
# ── logging ───────────────────────────────────────────────────────
# Maximum size of each classic event log. Bigger logs mean an attack
# can't push the evidence out before we read it.
common_eventlog_sizes:
  Security: 512MB
  System: 128MB
  Application: 128MB
  Windows PowerShell: 128MB
 
# ── firewall ──────────────────────────────────────────────────────
# Who may reach the management ports (WinRM, RDP). "any" keeps today's
# behaviour; change it to the Ansible machine's/team's IPs once known,
# e.g. "10.30.20.50" or "10.30.20.0/24". Get this wrong and we lose WinRM.
common_mgmt_sources: any
 
# Inbound allow rules. "applies_to" lists group names and/or host names;
# a host gets the rule if it is in any of them. WinRM is always added by the
# task file itself so it can't be forgotten here.
common_firewall_rules:
  - { name: RDP,              protocol: tcp, port: "3389", applies_to: [all], mgmt: true }
  # Domain controllers: AD DS, DNS, Kerberos, time
  - { name: DNS TCP,          protocol: tcp, port: "53",   applies_to: [domain_controllers] }
  - { name: DNS UDP,          protocol: udp, port: "53",   applies_to: [domain_controllers] }
  - { name: Kerberos TCP,     protocol: tcp, port: "88,464", applies_to: [domain_controllers] }
  - { name: Kerberos UDP,     protocol: udp, port: "88,464", applies_to: [domain_controllers] }
  - { name: NTP,              protocol: udp, port: "123",  applies_to: [domain_controllers] }
  - { name: RPC Endpoint Mapper, protocol: tcp, port: "135", applies_to: [domain_controllers] }
  - { name: RPC Dynamic,      protocol: tcp, port: "49152-65535", applies_to: [domain_controllers] }
  - { name: LDAP TCP,         protocol: tcp, port: "389,636,3268,3269", applies_to: [domain_controllers] }
  - { name: LDAP UDP,         protocol: udp, port: "389",  applies_to: [domain_controllers] }
  - { name: AD Web Services,  protocol: tcp, port: "9389", applies_to: [domain_controllers] }
  - { name: SMB,              protocol: tcp, port: "445",  applies_to: [domain_controllers, fs01-win] }
  # Per-host services
  - { name: DHCP Server,      protocol: udp, port: "67",   applies_to: [dc02] }
  - { name: HTTP/HTTPS,       protocol: tcp, port: "80,443", applies_to: [app01] }
 
