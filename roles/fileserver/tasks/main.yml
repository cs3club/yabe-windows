---
# roles/fileserver/tasks/main.yml
# Configures FS01-WIN as the Yabe SMB file server.
# Every tunable value comes from vars/main.yml (the fileserver_* variables).

- name: Set the computer name
  ansible.windows.win_hostname:
    name: "{{ fileserver_hostname }}"
  register: fileserver_hostname_result

- name: Install the file server features
  ansible.windows.win_feature:
    name: "{{ fileserver_features }}"
    state: present
    include_management_tools: true
  register: fileserver_features_result

- name: Reboot if the rename or feature install requires it
  ansible.windows.win_reboot:
    reboot_timeout: 600
  when: >-
    fileserver_hostname_result.reboot_required or
    fileserver_features_result.reboot_required

- name: Create the share root folder
  ansible.windows.win_file:
    path: "{{ fileserver_share_root }}"
    state: directory

- name: Create a folder for each share
  ansible.windows.win_file:
    path: '{{ fileserver_share_root }}\{{ item.name }}'
    state: directory
  loop: "{{ fileserver_shares }}"
  loop_control:
    label: "{{ item.name }}"

- name: Create the SMB shares
  ansible.windows.win_share:
    name: "{{ item.name }}"
    path: '{{ fileserver_share_root }}\{{ item.name }}'
    description: "{{ item.description | default(omit) }}"
    full: "{{ item.full | default(omit) }}"
    change: "{{ item.change | default(omit) }}"
    read: "{{ item.read | default(omit) }}"
    list: false
    encrypt: "{{ fileserver_smb_encrypt }}"
    state: present
  loop: "{{ fileserver_shares }}"
  loop_control:
    label: "{{ item.name }}"
