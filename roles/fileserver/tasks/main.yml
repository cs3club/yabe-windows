---
# roles/fileserver/tasks/main.yml
# Configures FS01-WIN as the Yabe SMB file server.
# Every tunable value comes from vars/main.yml (the fileserver_* variables).
#
# Order matters for security: each folder's NTFS permissions are locked down
# BEFORE it is shared, so a share never exposes loose permissions.

# -- Base system ---------------------------------------------------------------

- name: Set the computer name
  ansible.windows.win_hostname:
    name: "{{ fileserver_hostname }}"
  register: fileserver_hostname_result

- name: Install the file server features
  ansible.windows.win_feature:
    name: "{{ fileserver_features }}"
    state: present
    include_management_tools: true
  register: fileserver_features_result

- name: Reboot if the rename or feature install requires it
  ansible.windows.win_reboot:
    reboot_timeout: 600
  when: >-
    fileserver_hostname_result.reboot_required or
    fileserver_features_result.reboot_required

# -- Share root and its NTFS permissions ---------------------------------------

- name: Create the share root folder
  ansible.windows.win_file:
    path: "{{ fileserver_share_root }}"
    state: directory

- name: Grant the base NTFS permissions on the share root
  ansible.windows.win_acl:
    path: "{{ fileserver_share_root }}"
    user: "{{ item.user }}"
    rights: "{{ item.rights }}"
    type: allow
    state: present
    inherit: ContainerInherit, ObjectInherit
    propagation: None
  loop: "{{ fileserver_root_ntfs_allow }}"
  loop_control:
    label: "{{ item.user }}: {{ item.rights }}"

- name: Stop the share root inheriting permissions from the C drive
  ansible.windows.win_acl_inheritance:
    path: "{{ fileserver_share_root }}"
    state: absent
    reorganize: false

# -- Share folders and their extra NTFS permissions ----------------------------

- name: Create a folder for each share
  ansible.windows.win_file:
    path: '{{ fileserver_share_root }}\{{ item.name }}'
    state: directory
  loop: "{{ fileserver_shares }}"
  loop_control:
    label: "{{ item.name }}"

- name: Grant each share folder its extra NTFS permissions
  ansible.windows.win_acl:
    path: '{{ fileserver_share_root }}\{{ item.0.name }}'
    user: "{{ item.1.user }}"
    rights: "{{ item.1.rights }}"
    type: allow
    state: present
    inherit: ContainerInherit, ObjectInherit
    propagation: None
  loop: "{{ fileserver_shares | subelements('ntfs_allow') }}"
  loop_control:
    label: "{{ item.0.name }}: {{ item.1.user }} {{ item.1.rights }}"

# -- SMB shares ----------------------------------------------------------------

- name: Create the SMB shares
  ansible.windows.win_share:
    name: "{{ item.name }}"
    path: '{{ fileserver_share_root }}\{{ item.name }}'
    description: "{{ item.description | default(omit) }}"
    full: "{{ item.full | default(omit) }}"
    change: "{{ item.change | default(omit) }}"
    read: "{{ item.read | default(omit) }}"
    list: false
    encrypt: "{{ fileserver_smb_encrypt }}"
    state: present
  loop: "{{ fileserver_shares }}"
  loop_control:
    label: "{{ item.name }}"
