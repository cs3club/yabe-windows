---
# roles/win_hardening/handlers/main.yml
# Handlers only run when a task that notifies them reports "changed", and
# they run ONCE at the end of the play no matter how many tasks notified
# them. Tasks notify the topic "Reboot Windows host"; both handlers below
# listen for it, and their "when" decides which one actually does something.

# win_hardening_allow_reboot is set in /yabe-windows/roles/win_hardening/vars/main.yml
- name: Reboot to apply hardening changes
  ansible.windows.win_reboot:
    msg: Reboot initiated by Ansible (win_hardening)
    reboot_timeout: 900   # seconds to wait for WinRM to come back
  listen: Reboot Windows host
  when: win_hardening_allow_reboot | bool
 
- name: Warn that a reboot is still needed
  ansible.builtin.debug:
    msg: >-
      {{ inventory_hostname }} needs a reboot for some hardening settings
      (SMBv1, SMB signing, LSA protection, Defender install) to take effect.
      Reboot it when it is safe, or re-run with -e win_hardening_allow_reboot=true.
  listen: Reboot Windows host
  when: not (win_hardening_allow_reboot | bool)
