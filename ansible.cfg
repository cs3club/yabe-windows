# ansible.cfg
# Ansible configuration for this project.
# Ansible checks this directory first, so this file takes effect
# for anyone who clones this repo without touching their system config.

[defaults]
inventory         = inventory/hosts.yml
roles_path        = roles
host_key_checking = True
retry_files_enabled = False
stdout_callback   = default
result_format     = yaml

# Vars plugins load variables before any task runs. host_group_vars is the
# built-in one that reads group_vars/ and host_vars/; community.sops.sops
# decrypts any *.sops.yml file in those same folders. Listing a plugin here
# replaces the default list, so host_group_vars must stay in it.
vars_plugins_enabled = host_group_vars,community.sops.sops
