---
# site.yml
# Master playbook — entry point for everything.
# Run with:
#   ansible-playbook site.yml --check --diff   (dry run first, always)
#   ansible-playbook site.yml                  (apply)
#   ansible-playbook site.yml --tags <tag>     (run one role only)

- name: All plays
  hosts: all
  gather_facts: true
  roles:
    # Baseline hardening for every host. Run one area with e.g.
    # --tags protocols (see roles/win_hardening/tasks/main.yml for the tags).
    - role: common
      tags: common
