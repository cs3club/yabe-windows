---
# site.yml
# Master playbook — entry point for everything.
# Run with:
#   ansible-playbook site.yml --check --diff   (dry run first, always)
#   ansible-playbook site.yml                  (apply)
#   ansible-playbook site.yml --tags <tag>     (run one role only)

# One play per machine. Plays run top to
# bottom, one after another, so the order is the build order: the first DC
# must exist before a second DC or any member server can join the domain.
# Each play only targets its own host, so --limit is optional.

# Future: settings every machine needs go in a `base` role, first:
# - name: Base configuration
#   hosts: all
#   roles:
#     - role: base
#       tags: [base]

- name: DC01 primary domain controller, users and Group Policy
  hosts: dc01
  gather_facts: true
  roles:
    - role: dc01
      tags: [dc01]

