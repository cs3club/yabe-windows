---
# site.yml
# Master playbook — entry point for everything.
# Run with:
#   ansible-playbook site.yml --check --diff   (dry run first, always)
#   ansible-playbook site.yml                  (apply)
#   ansible-playbook site.yml --tags <tag>     (one role, e.g. common, or one area, e.g. firewall)
#   ansible-playbook site.yml --limit <host>   (one machine, e.g. dc01)
# Variables and decrypted secrets load automatically from
# inventory/group_vars/all/ (see README "How secrets are loaded").
 
- name: All plays
  hosts: all
  gather_facts: true
  roles:
    # Baseline hardening for every host. Run one area with e.g.
    # --tags protocols (see roles/common/tasks/main.yml for the tags).
    - role: common
      tags: common
 
